name: 1 - Survey Windows runner

# Chạy thủ công: tab Actions -> chọn workflow này -> Run workflow
on:
  workflow_dispatch:

jobs:
  survey:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Disk space (all drives)
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='UsedGB'; e={[math]::Round($_.Used/1GB,1)}},
              @{n='FreeGB'; e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize

      - name: CPU, RAM, OS
        shell: pwsh
        run: |
          Get-CimInstance Win32_ComputerSystem |
            Select-Object NumberOfLogicalProcessors,
              @{n='RAM_GB'; e={[math]::Round($_.TotalPhysicalMemory/1GB,1)}}
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version

      - name: Visual Studio and Clang/CL component
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "--- Installed Visual Studio ---"
          & $vswhere -all -products * -format json |
            ConvertFrom-Json |
            Select-Object displayName, installationVersion, installationPath |
            Format-List
          Write-Host "--- Component: C++ Clang compiler for Windows (empty = missing) ---"
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          Write-Host "--- Component: Clang toolset for MSBuild (empty = missing) ---"
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset -property installationPath

      - name: Tools on PATH
        shell: pwsh
        run: |
          foreach ($t in 'py','python','git','cmake','ninja','cargo','rustc','rustup','choco','clang-cl','nasm') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if ($c) { "{0,-9} {1}" -f $t, $c.Source } else { "{0,-9} NOT FOUND" -f $t }
          }

      - name: Tool versions
        shell: pwsh
        continue-on-error: true
        run: |
          git --version
          cmake --version
          ninja --version
          rustc --version
          cargo --version
          python --version

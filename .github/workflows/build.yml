name: 2 - Build Ladybird (Windows, experimental)

# Chạy thủ công: tab Actions -> chọn workflow này -> Run workflow
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag hoặc commit của LadybirdBrowser/ladybird"
        required: false
        default: "master"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360   # mức tối đa của runner miễn phí
    env:
      # Đặt cache nhị phân của vcpkg ở ổ D: để lưu/khôi phục giữa các lần chạy
      VCPKG_DEFAULT_BINARY_CACHE: D:\vcpkg-cache
    steps:
      - name: Disk space before
        shell: pwsh
        run: |
          Write-Host "GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"
          Write-Host "TEMP             = $env:TEMP"
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='FreeGB'; e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize

      - name: Allow long paths
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --global core.symlinks true

      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          path: ladybird
          fetch-depth: 1

      # Clang 22 có thêm cảnh báo mới (ví dụ -Wunused-but-set-global) mà Ladybird
      # chưa kịp sửa, trong khi Ladybird biên dịch với -Werror nên cảnh báo thành
      # lỗi. Đổi -Werror thành -Wno-error trong các file CMake (chỉ cho bản build này).
      - name: Relax -Werror
        shell: pwsh
        working-directory: ladybird
        run: |
          $files = Get-ChildItem -Recurse -File -Include CMakeLists.txt,*.cmake,CMakePresets.json |
                   Where-Object { $_.FullName -notmatch '\\(Build|\.git)\\' }
          $patched = 0
          foreach ($f in $files) {
            $text = Get-Content -Raw -LiteralPath $f.FullName
            if ($text -match '-Werror(?![=\w-])') {
              Write-Host "Patching $($f.FullName)"
              $new = $text -replace '-Werror(?![=\w-])', '-Wno-error'
              Set-Content -LiteralPath $f.FullName -Value $new -NoNewline
              $patched++
            }
          }
          Write-Host "Patched $patched file(s)"
          if ($patched -eq 0) { Write-Warning "No -Werror found in CMake files" }

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: D:\vcpkg-cache
          key: vcpkg-windows-v1-${{ github.run_id }}
          restore-keys: |
            vcpkg-windows-v1-

      - name: Install pkgconfiglite
        shell: pwsh
        run: choco install pkgconfiglite -y --no-progress

      # Runner có LLVM 20 cài sẵn, nhưng thư viện chuẩn của VS 2026 (MSVC 14.52)
      # yêu cầu Clang 22 trở lên (lỗi STL1000), nên nâng cấp LLVM trước khi build.
      - name: Upgrade LLVM
        shell: pwsh
        run: |
          choco upgrade llvm -y --no-progress
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      - name: Show Rust toolchain
        shell: pwsh
        run: |
          rustup show
          rustc --version

      # Runner hiện có Visual Studio Enterprise 2026 (bản 18), nên tự nạp môi
      # trường vcvars64 thay vì phụ thuộc vào action bên thứ ba.
      - name: Set up Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          Write-Host "Using $vcvars"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Check compiler
        shell: pwsh
        run: |
          Write-Host "--- clang-cl on PATH (the one the build will use) ---"
          Get-Command clang-cl | Select-Object Source
          $ver = clang-cl --version | Out-String
          Write-Host $ver
          if ($env:llvmX64 -and (Test-Path (Join-Path $env:llvmX64 "clang-cl.exe"))) {
            Write-Host "--- clang-cl bundled with Visual Studio (for reference) ---"
            & (Join-Path $env:llvmX64 "clang-cl.exe") --version
          }
          $m = [regex]::Match($ver, 'clang version (\d+)')
          if (-not $m.Success) { throw "Cannot read clang-cl version" }
          if ([int]$m.Groups[1].Value -lt 22) {
            throw "clang-cl $($m.Groups[1].Value) is too old: the MSVC STL in VS 2026 needs Clang 22 or newer"
          }
          Get-Command cl, link, ninja, cmake | Select-Object Name, Source

      - name: Build Ladybird
        shell: pwsh
        working-directory: ladybird
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py Meta\ladybird.py build
          } else {
            python Meta\ladybird.py build
          }

      # Lưu cache ngay cả khi build lỗi, để lần chạy sau khỏi build lại vcpkg
      - name: Save vcpkg binary cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: D:\vcpkg-cache
          key: vcpkg-windows-v1-${{ github.run_id }}

      - name: Disk space after
        if: always()
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='FreeGB'; e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize

      - name: Package output
        id: package
        if: success()
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ladybird\Build -Recurse -Filter Ladybird.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($exe) {
            Write-Host "Found: $($exe.FullName)"
            Compress-Archive -Path "$($exe.DirectoryName)\*" -DestinationPath ladybird-windows.zip
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Ladybird.exe not found under ladybird\Build"
            "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload build
        if: success() && steps.package.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows
          path: ladybird-windows.zip
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ladybird/Build/**/*.log
          if-no-files-found: ignore
          retention-days: 3

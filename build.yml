name: 2 - Build Ladybird (Windows, experimental)

# Chạy thủ công: tab Actions -> chọn workflow này -> Run workflow
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag hoặc commit của LadybirdBrowser/ladybird"
        required: false
        default: "master"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360   # mức tối đa của runner miễn phí
    steps:
      - name: Disk space before
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='FreeGB'; e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize

      - name: Allow long paths
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --global core.symlinks true

      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref }}
          path: ladybird
          fetch-depth: 1

      - name: Install pkgconfiglite
        shell: pwsh
        run: choco install pkgconfiglite -y --no-progress

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Set up Visual Studio developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Ladybird
        shell: pwsh
        working-directory: ladybird
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py Meta\ladybird.py build
          } else {
            python Meta\ladybird.py build
          }

      - name: Disk space after
        if: always()
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='FreeGB'; e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize

      - name: Package output
        id: package
        if: success()
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ladybird\Build -Recurse -Filter Ladybird.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($exe) {
            Write-Host "Found: $($exe.FullName)"
            Compress-Archive -Path "$($exe.DirectoryName)\*" -DestinationPath ladybird-windows.zip
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Ladybird.exe not found under ladybird\Build"
            "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload build
        if: success() && steps.package.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-windows
          path: ladybird-windows.zip
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ladybird/Build/**/*.log
          if-no-files-found: ignore
          retention-days: 3
